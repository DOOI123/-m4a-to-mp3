<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一份来自内心的灵魂拷问 💖</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fff0f5; /* 浪漫淡粉色背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(255, 182, 193, 0.4);
            max-width: 400px;
            width: 85%;
        }
        .heart-icon {
            font-size: 50px;
            color: #ff69b4;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff4500;
            margin-bottom: 40px;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .btn-group {
            position: relative;
            height: 60px;
            width: 100%;
            display: flex;
            justify-content: space-around;
        }
        button {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #yes-btn {
            background-color: #ff69b4; /* 恋爱粉 */
            color: white;
            transition: transform 0.2s;
        }
        #yes-btn:active {
            transform: scale(0.95);
        }
        #no-btn {
            background-color: #a9a9a9; /* 灰色 */
            color: white;
            position: absolute;
            right: 15%;
        }
        /* 心跳动画 */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.15); }
            40% { transform: scale(1); }
            60% { transform: scale(1.15); }
            80% { transform: scale(1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="heart-icon">❤️</div>
    <h1 id="question">郑泽佑，你到底爱不爱我？</h1>
    <div class="btn-group">
        <!-- 为了防止按钮瞬移时重叠，把“爱”固定在左边 -->
        <button id="yes-btn" onclick="loveAnswer()">爱</button>
        <button id="no-btn" onmouseover="escapeBtn()" onclick="escapeBtn()">不爱</button>
    </div>
</div>

<script>
    // 让“不爱”按钮疯狂逃跑的逻辑
    function escapeBtn() {
        const noBtn = document.getElementById('no-btn');
        
        // 计算安全的瞬移边界，防止按钮跑到屏幕外面去
        const padding = 30;
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding * 2) + padding;
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding * 2) + padding;
        
        noBtn.style.position = 'fixed';
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
    }

    // 点击“爱”之后的甜蜜反转
    function loveAnswer() {
        const question = document.getElementById('question');
        const btnGroup = document.querySelector('.btn-group');
        const heart = document.querySelector('.heart-icon');
        
        question.innerHTML = "✨ 哼，算你识相！<br>我也超级爱你呀！💕";
        btnGroup.style.display = 'none'; // 隐藏所有按钮
        heart.innerHTML = "💖👩‍❤️‍👨💖";
    }
</script>

</body>
</html>
