<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Converter Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <header>
            <div class="apple-icon"></div>
            <h1>音频转换专业版</h1>
            <p class="desc">由云端引擎驱动的高清 MP3 转换器</p>
        </header>

        <main>
            <div class="drop-zone" id="dropZone">
                <div class="inner-content">
                    <div class="upload-icon">↑</div>
                    <p id="fileLabel">选择 M4A 或 WAV 文件</p>
                    <span id="fileInfo">支持最大 50MB</span>
                </div>
                <input type="file" id="fileInput" accept=".m4a, audio/x-m4a, audio/*" hidden>
            </div>

            <div class="settings-card">
                <div class="setting-item">
                    <span>目标格式</span>
                    <select id="format">
                        <option value="mp3">MP3 (标准)</option>
                        <option value="wav">WAV (无损)</option>
                    </select>
                </div>
            </div>

            <button id="convertBtn" class="primary-btn" disabled>立即转换</button>
        </main>

        <div id="statusArea" class="status-hidden">
            <div class="loader"></div>
            <p id="statusMsg">准备就绪</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
